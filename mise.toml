[tools]
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"

[settings]
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[tasks.install]
description = "Provision every pinned tool from mise.lock"
run = "mise install --locked"

[tasks.build]
description = "Compile every workspace target with a real codegen build"
run = "cargo build --workspace --all-targets --all-features"

[tasks.test]
run = "cargo nextest run --workspace --all-features"

[tasks.lint]
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all -- --check"

[tasks.ci]
description = "Human aggregate: every gate the CI lane runs"
depends = ["install", "build", "test", "lint", "fmt"]
