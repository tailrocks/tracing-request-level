# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: Release
run-name: Release · ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Control / Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@03f9409b3f649a8973169dde0ebba3fe58a92ac9
        with:
          rev: 03f9409b3f649a8973169dde0ebba3fe58a92ac9
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=03f9409b3f649a8973169dde0ebba3fe58a92ac9" >> "$GITHUB_ENV"
      - name: Enforce workflow policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: velnor-workflow policy --workflow-root "$GITHUB_WORKSPACE"
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Verify tag
        run: velnor-workflow release verify-tag --branch 'main' --package 'tracing-request-level'
      - name: Package declared crates
        run: mbx package --workspace --locked
      - name: Attest crate packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/*.crate
      - name: Upload crate packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-packages
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 2

  release-github-rust-tracing-request-level:
    name: "GitHub / Rust / rust-tracing-request-level"
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Velnor workflow runtime
        if: ${{ runner.environment == 'github-hosted' }}
        uses: tailrocks/velnor/.github/actions/setup-velnor-workflow@03f9409b3f649a8973169dde0ebba3fe58a92ac9
        with:
          rev: 03f9409b3f649a8973169dde0ebba3fe58a92ac9
      - name: Set trusted workflow policy revision
        run: echo "VELNOR_WORKFLOW_POLICY_REVISION=03f9409b3f649a8973169dde0ebba3fe58a92ac9" >> "$GITHUB_ENV"
      - name: Restore Rust toolchain
        id: rustup-toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup
          key: velnor-rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rust-toolchain') }}
      - name: Provision Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install --profile minimal
      - name: Bound the Mr. Boxington store
        shell: bash
        run: echo "MBX_GC_MAX_SIZE=12GiB" >> "$GITHUB_ENV"
      - name: Set up Mr. Boxington
        id: mbx-cache
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: github
          github-cache-mode: objects
          version: 1.11.1
          cache-key: velnor-mbx-v3-946b8decce11-${{ runner.os }}-${{ runner.arch }}-rust-tracing-request-level-${{ hashFiles('.cargo/**', 'Cargo.lock', 'rust-toolchain', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'deny.toml') }}
          restore-keys: |
            velnor-mbx-v3-946b8decce11-${{ runner.os }}-${{ runner.arch }}-rust-tracing-request-level-${{ hashFiles('.cargo/**', 'Cargo.lock', 'rust-toolchain', 'rust-toolchain.toml') }}-
            velnor-mbx-v3-946b8decce11-${{ runner.os }}-${{ runner.arch }}-rust-tracing-request-level-
          save-on-workflow-dispatch: true
      - name: Restore mold 2.42.0 cache
        id: mold-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/velnor/mold/2.42.0
          key: velnor-mold-2.42.0-${{ runner.os }}-${{ runner.arch }}
      - name: Set up mold 2.42.0
        shell: bash
        env:
          MOLD_VERSION: 2.42.0
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) mold_arch=x86_64; expected='f5ed2f6e31d1ada4f07fe766fe0de7a73104d1c5cdc59086fcecc16a43720b6d' ;;
            aarch64) mold_arch=aarch64; expected='3c9a0a3624aac8a2007569ae50c33b3129a0f0ae8bcc974aeee2f8939d295190' ;;
            *) echo "unsupported mold architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          cache_dir="$HOME/.cache/velnor/mold/$MOLD_VERSION"
          archive="$cache_dir/mold-$MOLD_VERSION-$mold_arch-linux.tar.gz"
          mkdir -p "$cache_dir"
          if [[ ! -s "$archive" ]]; then
            temporary="$archive.download"
            trap 'rm -f "$temporary"' EXIT
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              --output "$temporary" \
              "https://github.com/rui314/mold/releases/download/v$MOLD_VERSION/mold-$MOLD_VERSION-$mold_arch-linux.tar.gz"
            printf '%s  %s\n' "$expected" "$temporary" | sha256sum --check --strict
            mv "$temporary" "$archive"
            trap - EXIT
          fi
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --strict
          if [[ "$(id -u)" -eq 0 ]]; then
            tar --directory /usr/local --strip-components=1 --no-overwrite-dir -xzf "$archive"
            ln -sf /usr/local/bin/mold "$(realpath /usr/bin/ld 2>/dev/null || printf /usr/bin/ld)"
          else
            sudo tar --directory /usr/local --strip-components=1 --no-overwrite-dir -xzf "$archive"
            sudo ln -sf /usr/local/bin/mold "$(realpath /usr/bin/ld 2>/dev/null || printf /usr/bin/ld)"
          fi
          mold --version | grep -F "$MOLD_VERSION"
      - name: Restore "Rust crate (tracing-request-level)" cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ci-release-${{ runner.os }}-rust-tracing-request-level-${{ hashFiles('.cargo/**', 'Cargo.lock', 'rust-toolchain.toml', 'rust-toolchain') }}
      - name: Run "Rust crate (tracing-request-level)" checks
        env:
          CI_SCOPE: full
          CI_UNIT_ID: rust-tracing-request-level
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: velnor-workflow run --config .github/ci/project.toml --scope "$CI_SCOPE" --unit rust-tracing-request-level

  release-velnor-rust-tracing-request-level:
    name: "Velnor / Rust / rust-tracing-request-level"
    if: ${{ (github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')) || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    needs: [verify]
    runs-on: [self-hosted, velnor-target-mvp]
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Velnor runner identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Velnor runner identity'
            echo
            echo "- Host: ${VELNOR_HOST:-unset}"
            echo "- Instance: ${VELNOR_INSTANCE:-unset}"
            echo "- Slot: ${VELNOR_SLOT:-unset}"
            echo "- GitHub runner: ${RUNNER_NAME:-unset}"
            echo "- OS/arch: ${RUNNER_OS:-unset}/${RUNNER_ARCH:-unset}"
            echo "- Execution backend: ${VELNOR_EXECUTION_BACKEND:-unset}"
            echo "- Velnor version: ${VELNOR_MANIFEST_VERSION:-${VELNOR_SOURCE_SHA:-unset}}"
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - name: Set up Mr. Boxington
        id: mbx-cache
        uses: jdx/mr-boxington-action@7234d3dd1a6ca8f6c381eea8e4dfb03f18fcf777 # v1.3.0
        with:
          backend: local
      - name: Run "Rust crate (tracing-request-level)" checks
        env:
          CI_SCOPE: full
          CI_UNIT_ID: rust-tracing-request-level
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          MISE_AUTO_INSTALL: "false"
          MISE_EXEC_AUTO_INSTALL: "false"
          MISE_NOT_FOUND_AUTO_INSTALL: "false"
        run: velnor-workflow run --config .github/ci/project.toml --scope "$CI_SCOPE" --unit rust-tracing-request-level


  publish:
    name: Publish crates.io packages
    needs: [verify, release-github-rust-tracing-request-level, release-velnor-rust-tracing-request-level]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download crate packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-packages
          path: target/package
      - name: Verify crate provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in target/package/*.crate; do gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"; done
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          mbx publish --locked --package 'tracing-request-level'
# Release tags are cut from the protected main branch.
