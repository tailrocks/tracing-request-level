[package]
name = "tracing-request-level"
version = "0.1.0"
edition = "2024"
description = "Request-scoped tracing level overrides for Rust services"
license = "MIT OR Apache-2.0"
repository = "https://github.com/donbeave/tracing-request-level"
homepage = "https://github.com/donbeave/tracing-request-level"
documentation = "https://docs.rs/tracing-request-level"
keywords = ["tracing", "logging", "axum", "tonic", "grpc"]

[features]
default = []
axum = ["dep:axum", "dep:http-body-util", "request-context"]
grpc-server-interceptor = ["dep:protify", "dep:tonic"]
tonic-client = ["dep:tonic", "request-context"]
tonic-client-logging = ["dep:http", "dep:tower"]
tonic-server = ["dep:http", "dep:tower", "request-context"]
request-context = ["dep:tokio"]

[dependencies]
axum = { version = "0.8", optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
protify = { version = "0.1.4", default-features = false, features = ["tonic"], optional = true }
tokio = { version = "1", optional = true }
tonic = { version = "0.14", optional = true }
tower = { version = "0.5", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }

[lints]
workspace = true

[workspace]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "deny"
